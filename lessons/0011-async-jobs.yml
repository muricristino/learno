  title: "Amazon Builders' Library — Timeouts, retries, and backoff with jitter"
  url: "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"
  note: >
    Marc Brooker, AWS. Cobre timeout, política de retry, backoff com jitter e
    tokens de idempotência a partir do que a Amazon opera em produção. Para a
    camada de profundidade, DDIA cap. 11 trata at-least-once e o que
