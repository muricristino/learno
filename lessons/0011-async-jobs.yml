meta:
  title: "Tarefas longas e jobs assíncronos"
  subtitle: "Como tirar o trabalho de 90 segundos da requisição — e o que fazer quando ele falha na terceira tentativa."

analogy:
  label: "Pense na lavanderia da esquina"
  text: >
    Você entrega o terno e recebe uma ficha numerada. Ninguém espera de pé no
    balcão as quatro horas que a limpeza leva: você sai, faz sua vida, e volta
    com a ficha para perguntar se já ficou pronto. Naquele momento a ficha vale
    mais que o terno — é ela que prova que o pedido existe e é ela que te deixa
    consultar o estado.
  bridge: "Essa ficha é o job id, e o balcão que responde \"ainda não\" é o endpoint de status."

intro:
  body: |
    Na lição passada você tirou o trabalho pesado da requisição e jogou numa
    fila. Isso resolveu o pico. Ficou faltando o outro lado do problema: **o
    usuário ainda está lá**, olhando a tela, e ninguém devolveu nada para ele.

    Esta lição é sobre o contrato entre os dois lados. Como você responde na
    hora sem ter o resultado, onde o cliente busca esse resultado depois, e o
    que acontece quando o job explode no meio do caminho.

