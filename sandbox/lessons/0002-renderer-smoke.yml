meta:
  title: "Sandbox — Renderer smoke test"
  subtitle: "Lição descartável: existe só para provar o pipeline JSON + YAML de ponta a ponta"

analogy:
  label: "Pense num guarda-volumes de academia"
  text: >
    Cada armário guarda as coisas de uma pessoa. Você não precisa procurar em
    todos — a etiqueta na chave diz exatamente qual abrir.
  bridge: "Essa etiqueta é a chave de shard, e o armário é o nó que guarda o dado."

intro:
  caption: "Fluxo de uma requisição até o nó certo"
  body: |
    Este parágrafo veio do **YAML**, não do JSON. O JSON só disse *qual*
    componente usar e em que ordem — o texto está aqui, referenciado por
    `@intro.body`.

    Este é um segundo parágrafo, separado por linha em branco. Ele existe para
    provar que o subconjunto de markdown do componente `prose` quebra parágrafos
    corretamente, e que [links](https://github.com/murichristopher/learno) também
    funcionam.

detail:
  caption: "Variantes de nó e de aresta na mesma figura"
  body: |
    O diagrama acima e o de baixo **não têm uma cor sequer** no YAML. Se você
    escrever `fill="#9333ea"` num deles, o build recusa a lição inteira e diz
    qual diagrama tem o problema.

